name: Build and deploy VUniq

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('vuniq-pr-{0}', github.event.pull_request.number) || 'vuniq-production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUN_FFMPEG_TESTS: 'true'
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      TELEGRAM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Save verified build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vuniq-jar
          path: target/video-unique-service-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Roll back VPS' || 'Deploy VPS' }}
    needs: build
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    steps:
      - name: Download verified build
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vuniq-jar
      - name: Update VPS over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_options=(
            -T -i "$ssh_dir/key"
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3
          )
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf 'rollback\n' | ssh "${ssh_options[@]}" "vuniq-deploy@$VPS_HOST"
          else
            jar=video-unique-service-0.1.0-SNAPSHOT.jar
            read -r sha256 _ < <(sha256sum "$jar")
            { printf 'deploy %s %s\n' "$sha256" "$GITHUB_SHA"; cat "$jar"; } |
              ssh "${ssh_options[@]}" "vuniq-deploy@$VPS_HOST"
          fi
