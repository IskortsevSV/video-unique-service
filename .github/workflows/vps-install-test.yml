name: Verify VPS installation
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/systemd/**'
      - '.github/workflows/vps-install-test.yml'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read

jobs:
  install-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build test release
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Check out official Telegram Bot API
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: tdlib/telegram-bot-api
          ref: 5df614c91dab8662cfbb24a501ec89949fdcfebb
          path: upstream-bot-api
          submodules: recursive
          persist-credentials: false
      - name: Build local Bot API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build gperf libssl-dev zlib1g-dev
          CC=clang CXX=clang++ cmake -S upstream-bot-api -B "$RUNNER_TEMP/bot-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG"
          cmake --build "$RUNNER_TEMP/bot-build" --target telegram-bot-api --parallel 3
      - name: Verify bootstrap, restricted SSH and recovery
        run: bash deploy/systemd/test-vps.sh target/video-unique-service-0.1.0-SNAPSHOT.jar "$RUNNER_TEMP/bot-build/telegram-bot-api"
